# Builds a signed APK and publishes it as a GitHub Release. Either push a tag like v3.1.0, or use
# "Run workflow" on master with a version: the tag is then created on that commit when the release is published.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v3.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/master ]] || { echo "Run this workflow from master, not $GITHUB_REF_NAME." >&2; exit 1; }
            tag="v${INPUT_VERSION#v}"
            [[ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]] || { echo "Tag $tag already exists; pick a new version." >&2; exit 1; }
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Version must look like v1.2.3, got $tag" >&2; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          (( minor < 100 && patch < 100 )) || { echo 'Minor and patch must be below 100.' >&2; exit 1; }
          echo "TLP_TAG=$tag" >> "$GITHUB_ENV"
          echo "TLP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "TLP_VERSION_CODE=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      # Match the devcontainer: npm 10 rejects the npm 11 lockfile (optional peer deps).
      - run: npm install -g npm@11

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Restore signing key
        env:
          TLP_KEYSTORE_BASE64: ${{ secrets.TLP_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$TLP_KEYSTORE_BASE64" ]] || { echo 'Secret TLP_KEYSTORE_BASE64 is not set.' >&2; exit 1; }
          echo "$TLP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TLP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          TLP_STORE_PASSWORD: ${{ secrets.TLP_STORE_PASSWORD }}
          TLP_KEY_ALIAS: ${{ secrets.TLP_KEY_ALIAS }}
        run: Mobile/scripts/build-android.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TopLoggerPlus-$TLP_VERSION_NAME.apk"
          mv Mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TLP_TAG" "$apk" --target "$GITHUB_SHA" --title "TopLogger Plus $TLP_VERSION_NAME" --generate-notes
